name: Publish to GHCR (fork)

# Builds the provider package and pushes it to ghcr.io/<repo owner>.
#
# Runs only for `fork/v*` tags or when started by hand; branch pushes never
# trigger it. A tag push runs the copy of this file in the tagged commit, so
# only tag commits that contain it. A manual run can build any ref through the
# `ref` input, including branches that don't contain this file.
#
#   git tag fork/v0.9.0-git.1 && git push glennpratt fork/v0.9.0-git.1
#   gh workflow run ghcr-publish.yml --ref ci/ghcr-publish -f ref=feat/git-ssh-auth

on:
  push:
    tags:
      - 'fork/v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the ref this run was started from)'
        required: false
        default: ''
      version:
        description: 'Package tag to publish (default: derived from git describe)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILDX_VERSION: 'v0.31.1'

jobs:
  publish:
    # Never publish from the upstream repository if this file is ever merged there.
    if: github.repository != 'crossplane-contrib/provider-ansible'
    runs-on: ubuntu-22.04

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine version and registry
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/fork/* ]]; then
            version="${GITHUB_REF_NAME#fork/}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            # Same VERSION the build machinery would compute for this checkout.
            # shellcheck disable=SC2016 # $(VERSION) is expanded by make
            version="$(make -s --no-print-directory -f Makefile -f - print-version <<<'print-version: ; @echo $(VERSION)' | tail -n1)"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$version' is not a valid OCI tag"
            exit 1
          fi
          if [[ "$version" == *dirty* ]]; then
            echo "::error::version '$version' is dirty"
            exit 1
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "Publishing $registry/provider-ansible:$version from $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-ghcr-publish-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-ghcr-publish-

      - name: Cache Go Dependencies
        uses: actions/cache@v5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Build Artifacts
        run: make -j2 build.all VERSION=${{ steps.meta.outputs.version }}
        env:
          # buildx doesn't load the images it builds unless asked to.
          BUILD_ARGS: "--load"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: >-
          make xpkg.release.publish
          VERSION=${{ steps.meta.outputs.version }}
          XPKG_REG_ORGS=${{ steps.meta.outputs.registry }}
